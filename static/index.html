<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O.R.I.O.N. Voice</title><style>
:root{color-scheme:dark;font:16px system-ui}body{background:#0b1020;color:#e6f0ff;max-width:900px;margin:auto;padding:24px}button,select,input{font:inherit;border:1px solid #34435e;border-radius:10px;padding:12px;background:#172239;color:white}button{cursor:pointer}button:disabled{opacity:.45}input{flex:1;min-width:50px}header{display:flex;justify-content:space-between;align-items:center}#log{background:#10182b;border-radius:16px;min-height:45vh;padding:16px;overflow:auto;max-height:60vh}.msg{padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}.user{background:#173d50;margin-left:12%}.assistant{background:#242b44;margin-right:12%}.controls{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}#state{color:#9fceff}.note{font-size:.85rem;color:#9aacc8}</style></head><body>
<header><h1>◉ O.R.I.O.N.</h1><span>Voice-first AI</span></header><p>Hosted Groq + Gemini · Tamil / English / Tanglish</p>
<div class="controls"><label for="agent">Agent</label><select id="agent"></select><button id="new">New conversation</button></div>
<main id="log" aria-live="polite"></main><p id="state" role="status">Ready</p>
<div class="controls"><button id="record">🎙 Start recording</button><button id="stop" disabled>■ Stop</button><label><input id="speak" type="checkbox" checked> Speak replies</label></div>
<form id="chat" class="controls"><input id="prompt" placeholder="Ask ORION in Tamil or English…" required maxlength="8000"><button id="send">Send</button></form>
<p class="note">Microphone audio and messages are sent to cloud AI providers. Chat history is stored on this machine. API keys stay on the Python backend. Do not expose this app to the public Internet.</p>
<script>
const $=x=>document.getElementById(x);let session=sessionStorage.getItem("orion_session")||crypto.randomUUID().replace(/-/g,"");sessionStorage.setItem("orion_session",session);
let recorder,chunks=[],stream;
async function request(url,options){const r=await fetch(url,options);if(!r.ok){let d;try{d=await r.json()}catch{}throw Error(d?.detail||"Request failed: "+r.status)}return r}
const state=x=>$("state").textContent=x;
function add(role,content){const d=document.createElement("div");d.className="msg "+role;d.textContent=(role==="user"?"YOU: ":"ORION: ")+content;$("log").append(d);$("log").scrollTop=$("log").scrollHeight}
async function chat(text){state("Thinking…");$("send").disabled=true;try{add("user",text);const r=await request("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,agent:$("agent").value,session})});const d=await r.json();add("assistant",d.answer);state("Ready");if($("speak").checked)await speak(d.answer)}catch(e){state("Error: "+e.message)}finally{$("send").disabled=false}}
async function speak(text){try{state("Generating voice…");const r=await request("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,agent:$("agent").value,session})});const blob=await r.blob();const url=URL.createObjectURL(blob);const a=new Audio(url);a.onended=()=>URL.revokeObjectURL(url);await a.play();state("Ready")}catch(e){state("Speech unavailable: "+e.message)}}
$("chat").onsubmit=e=>{e.preventDefault();const t=$("prompt").value.trim();if(t){$("prompt").value="";chat(t)}};
$("new").onclick=()=>{session=crypto.randomUUID().replace(/-/g,"");sessionStorage.setItem("orion_session",session);$("log").replaceChildren();state("New conversation")};
$("record").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());state("Transcribing…");try{const ext=recorder.mimeType.includes("mp4")?"mp4":"webm";const fd=new FormData();fd.append("file",new Blob(chunks,{type:recorder.mimeType}),"speech."+ext);const r=await request("/api/transcribe",{method:"POST",body:fd});const t=(await r.json()).text;if(t)await chat(t);else state("No speech detected")}catch(e){state("Transcription error: "+e.message)}};recorder.start();$("record").disabled=true;$("stop").disabled=false;state("Recording…")}catch(e){state("Microphone unavailable: "+e.message)}};
$("stop").onclick=()=>{if(recorder?.state==="recording")recorder.stop();$("record").disabled=false;$("stop").disabled=true};
(async()=>{try{const h=await(await request("/api/health")).json();for(const a of h.agents){const o=document.createElement("option");o.value=a;o.textContent=a.toUpperCase();$("agent").append(o)}const hist=await(await request("/api/history/"+session)).json();hist.messages.forEach(m=>add(m.role,m.content));if(!h.groq_configured||!h.gemini_configured)state("Configure GROQ_API_KEY and GEMINI_API_KEY in .env")}catch(e){state(e.message)}})();
</script></body></html>
